<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8d3ab">
<meta name="description" content="一个装满手写信的小小信箱">
<title>给你的信</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23a8352a' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<!-- 氛围层：主题背景（双层交叉淡入）/ 光斑 canvas / 暗角 / 纸纹噪点 / 七夕装饰 -->
<div class="theme-bg" id="bgA" aria-hidden="true"></div>
<div class="theme-bg" id="bgB" aria-hidden="true"></div>
<canvas id="fx-canvas" aria-hidden="true"></canvas>
<canvas id="fx-top-canvas" aria-hidden="true"></canvas>
<div class="qixi-deco" id="qixiDeco" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="page">
  <header class="site-head">
    <h1 class="site-title" id="siteTitle">给你的信</h1>
    <p class="site-sub" id="siteSub"></p>
    <p class="love-counter" id="loveCounter"></p>
  </header>

  <!-- 最新一封信（主视觉） -->
  <section class="hero" id="heroSlot" aria-label="最新的一封信"></section>

  <!-- 历史信件托盘 -->
  <section class="shelf-section" id="shelfSection" hidden>
    <h2 class="shelf-title">— 信箱里还有 —</h2>
    <div class="shelf-scroll">
      <div class="shelf-tray" id="shelfTray"></div>
    </div>
  </section>

  <footer class="site-foot" id="siteFoot"></footer>
</main>

<!-- 读信浮层 -->
<div class="reading-layer" id="readingLayer" hidden>
  <div class="reading-backdrop" id="readingBackdrop"></div>
  <div class="reading-panel" role="dialog" aria-modal="true" aria-labelledby="readingTitle">
    <header class="reading-head">
      <div class="reading-meta">
        <span class="reading-title" id="readingTitle"></span>
        <span class="reading-date" id="readingDate"></span>
      </div>
      <button class="reading-close" id="readingClose" aria-label="合上这封信">✕</button>
    </header>
    <div class="reading-pages" id="readingPages"></div>
    <nav class="reading-nav" aria-label="信件切换">
      <button class="nav-btn" id="navPrev">❮ &nbsp;上一封</button>
      <span class="nav-count" id="navCount"></span>
      <button class="nav-btn" id="navNext">下一封&nbsp; ❯</button>
    </nav>
  </div>
</div>

<noscript><p class="noscript-tip">这个信箱需要打开 JavaScript 才能拆信哦～</p></noscript>

<script src="data/letters.js?v=8"></script>
<script src="js/particles.js?v=8"></script>
<script src="js/envelope.js?v=8"></script>
<script src="js/app.js?v=8"></script>
</body>
</html>
